name: Екатеринбург — безопасная проверка токена и новостей

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/token-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify 18 bot tests
        run: python -m unittest -v test_bot.py
      - name: Verify the separate EKATERINBURG_VK_TOKEN secret exists
        env:
          EKATERINBURG_VK_TOKEN: ${{ secrets.EKATERINBURG_VK_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$EKATERINBURG_VK_TOKEN" ]]; then
            echo "::error::Missing EKATERINBURG_VK_TOKEN repository secret"
            exit 1
          fi
          echo "Ekaterinburg VK token is set (value hidden)."
      - name: Read real EKB news, but do not post anything
        env:
          DRY_RUN: "true"
        run: python main.py
