name: Проверка бота Екатеринбурга

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run 18 unit tests without network or VK token
        run: python -m unittest -v test_bot.py test_news_quality.py
      - name: Preview an actual EKB news story or local game (never publish)
        env:
          DRY_RUN: "true"
        run: python main.py
