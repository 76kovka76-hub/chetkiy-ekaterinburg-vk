name: Екатеринбург — первый пост в сообщество ВК

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/first-post.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chetkiy-ekaterinburg-vk-publisher
  cancel-in-progress: false

jobs:
  first-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout Ekaterinburg code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check bot rules
        run: python -m unittest -v test_bot.py
      - name: Send first real welcome post to VK 243223597
        env:
          EKATERINBURG_VK_TOKEN: ${{ secrets.EKATERINBURG_VK_TOKEN }}
        run: python first_post_once.py
      - name: Save post and hashtag history
        if: success()
        run: |
          if [[ -n "$(git status --porcelain history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json
            git commit -m "Record first published Ekaterinburg VK post"
            git pull --rebase
            git push
          fi
